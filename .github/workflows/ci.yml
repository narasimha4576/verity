name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t verity:ci .
      - name: Smoke test
        run: |
          docker run -d --name verity -p 8000:8000 verity:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health > /dev/null; then
              curl -fs http://localhost:8000/ | grep -q Verity
              docker rm -f verity
              exit 0
            fi
            sleep 2
          done
          docker logs verity
          exit 1
