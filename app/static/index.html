<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verity</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d7a5a'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='20' font-family='Georgia,serif' font-weight='700' fill='white'%3EV%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --sidebar: #eceef2;
  --ink: #17212b;
  --muted: #566474;
  --line: #d9dee5;
  --accent: #1d7a5a;
  --accent-strong: #0f5c42;
  --accent-soft: #dff1ea;
  --accent-ink: #ffffff;
  --user: #e4e8ee;
  --danger: #b3261e;
  --shadow: 0 1px 2px rgba(20, 30, 40, 0.06), 0 10px 28px rgba(20, 30, 40, 0.07);
  --sans: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: "Iowan Old Style", Charter, Georgia, "Times New Roman", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1418;
    --surface: #171d23;
    --sidebar: #12181d;
    --ink: #e7ecf1;
    --muted: #9aa8b6;
    --line: #27313a;
    --accent: #4cc79b;
    --accent-strong: #7be0b9;
    --accent-soft: #17352b;
    --accent-ink: #06231a;
    --user: #212a33;
    --danger: #f19189;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 28px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: 100%; }

/* Sidebar */
.sidebar {
  background: var(--sidebar);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 18px 14px;
  min-height: 0;
  overflow-y: auto;
}
.wordmark { font-family: var(--serif); font-weight: 700; font-size: 22px; letter-spacing: 0.01em; }
.btn {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 10px;
  padding: 9px 14px;
  font-weight: 500;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.docs h2 { font-size: 14px; font-weight: 600; margin: 0 0 8px; color: var(--muted); }
.docs .btn { width: 100%; }
.doc-list { display: flex; flex-direction: column; gap: 2px; }
.doc {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  padding: 8px;
  border-radius: 8px;
}
.doc:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.doc input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.doc-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.doc-meta { display: block; font-size: 12.5px; color: var(--muted); }
.icon-btn {
  border: 0;
  background: transparent;
  color: var(--muted);
  width: 28px;
  height: 28px;
  border-radius: 6px;
  line-height: 1;
  font-size: 15px;
}
.icon-btn:hover { background: color-mix(in srgb, var(--ink) 10%, transparent); color: var(--ink); }
.empty-docs, .scope, .upload-status, .fineprint { color: var(--muted); font-size: 13px; margin: 8px 2px; }
.upload-status:empty { display: none; }
.fineprint { margin-top: auto; line-height: 1.45; }

/* Main column */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; }
.topbar { display: none; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.chat { flex: 1; overflow-y: auto; min-height: 0; }
.chat-inner { max-width: 760px; margin: 0 auto; padding: 28px 20px 12px; }

.empty { padding: 12vh 0 0; }
.empty h1 { font-family: var(--serif); font-size: clamp(28px, 5vw, 38px); line-height: 1.2; margin: 0 0 10px; font-weight: 600; }
.empty p { color: var(--muted); margin: 0 0 22px; max-width: 52ch; }
.suggestions { display: flex; flex-wrap: wrap; gap: 10px; }
.suggestions .btn { border-radius: 999px; font-size: 14px; }

.msg { margin: 20px 0; }
.msg.user { display: flex; justify-content: flex-end; }
.msg.user .bubble {
  background: var(--user);
  padding: 10px 16px;
  border-radius: 18px 18px 6px 18px;
  max-width: 85%;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.msg.assistant { display: flex; gap: 12px; align-items: flex-start; }
.avatar {
  flex: none;
  width: 28px;
  height: 28px;
  margin-top: 2px;
  border-radius: 8px;
  background: var(--accent);
  color: var(--accent-ink);
  display: grid;
  place-items: center;
  font-family: var(--serif);
  font-weight: 700;
}
.body { min-width: 0; flex: 1; }
.text { font-family: var(--serif); font-size: 17px; line-height: 1.65; max-width: 66ch; white-space: pre-wrap; overflow-wrap: anywhere; }
.text.error { color: var(--danger); font-family: var(--sans); font-size: 15px; }
.text.muted { color: var(--muted); }
.stage { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; min-height: 28px; }
.stage:empty { display: none; }
.stage::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

.cites { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.cite {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface);
  font-size: 13px;
  overflow: hidden;
}
.cite .file { padding: 4px 10px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cite .page {
  padding: 4px 10px;
  background: var(--accent-soft);
  color: var(--accent-strong);
  font-weight: 600;
  border-left: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
}
.note { margin: 10px 0 0; font-size: 13px; color: var(--muted); max-width: 66ch; }
.actions { margin-top: 8px; }
.link-btn { border: 0; background: transparent; color: var(--muted); font-size: 13px; padding: 4px 0; }
.link-btn:hover { color: var(--ink); text-decoration: underline; }

/* Composer */
.composer-wrap { padding: 8px 20px 14px; }
.composer {
  max-width: 760px;
  margin: 0 auto;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 22px;
  box-shadow: var(--shadow);
  padding: 8px 8px 8px 18px;
}
.composer:focus-within { border-color: var(--accent); }
.composer textarea {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  resize: none;
  background: transparent;
  color: inherit;
  font: inherit;
  line-height: 1.5;
  max-height: 200px;
  padding: 8px 0;
}
.composer textarea::placeholder { color: var(--muted); }
.send {
  flex: none;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 0;
  background: var(--accent);
  color: var(--accent-ink);
  display: grid;
  place-items: center;
}
.send:disabled { opacity: 0.35; cursor: not-allowed; }
.send svg { width: 18px; height: 18px; }
.send .stop-icon { display: none; }
.send.busy .send-icon { display: none; }
.send.busy .stop-icon { display: block; }
.hint { max-width: 760px; margin: 8px auto 0; text-align: center; color: var(--muted); font-size: 12.5px; }

/* Toast and drag overlay */
.toast {
  position: fixed;
  left: 50%;
  bottom: 96px;
  transform: translateX(-50%);
  max-width: min(92vw, 520px);
  background: var(--ink);
  color: var(--bg);
  padding: 10px 16px;
  border-radius: 10px;
  box-shadow: var(--shadow);
  font-size: 14px;
  z-index: 40;
}
.toast[hidden] { display: none; }
body.dragging::after {
  content: "Drop a PDF to add it";
  position: fixed;
  inset: 12px;
  display: grid;
  place-items: center;
  border: 2px dashed var(--accent);
  border-radius: 18px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  font-family: var(--serif);
  font-size: 24px;
  z-index: 50;
  pointer-events: none;
}
.scrim { display: none; }

@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .topbar { display: flex; }
  .sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    width: min(86vw, 320px);
    transform: translateX(-100%);
    transition: transform 0.2s ease;
    z-index: 30;
  }
  body.menu-open .sidebar { transform: none; }
  body.menu-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); z-index: 25; }
  .empty { padding-top: 6vh; }
}
@media (prefers-reduced-motion: reduce) {
  .stage::before { animation: none; }
  .sidebar { transition: none; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Documents">
    <div class="wordmark">Verity</div>
    <button class="btn primary" id="new-chat" type="button">New chat</button>
    <section class="docs">
      <h2>Your documents</h2>
      <div class="doc-list" id="doc-list"></div>
      <p class="scope" id="scope"></p>
      <button class="btn" id="add-pdf" type="button">Add a PDF</button>
      <input id="file-input" type="file" accept="application/pdf,.pdf" multiple hidden>
      <p class="upload-status" id="upload-status" aria-live="polite"></p>
    </section>
    <p class="fineprint">Answers come only from your documents. If the answer is not there, Verity says so.</p>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="menu" type="button" aria-label="Open documents">&#9776;</button>
      <span class="wordmark">Verity</span>
    </header>
    <div class="chat" id="chat">
      <div class="chat-inner" id="chat-inner" aria-live="polite">
        <div class="empty" id="empty">
          <h1>What would you like to know?</h1>
          <p>Ask about your documents. Every answer shows the page it came from.</p>
          <div class="suggestions" id="suggestions"></div>
        </div>
      </div>
    </div>
    <div class="composer-wrap">
      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="Ask about your documents" aria-label="Your question" maxlength="500"></textarea>
        <button class="send" id="send" type="submit" aria-label="Send">
          <svg class="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          <svg class="stop-icon" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
      </form>
      <p class="hint">Enter to send, Shift+Enter for a new line</p>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<noscript>Verity needs JavaScript to run.</noscript>

<script>
"use strict";

const SUGGESTIONS = [
  "Summarize the key terms",
  "What fees or penalties apply?",
  "What deadlines or notice periods are mentioned?",
];
const STATUS_NOTES = {
  low_similarity: "Nothing in your documents is close to this question.",
  ungrounded: "Verity rejected this answer because its page citations could not be verified.",
  invalid_output: "Verity rejected this answer because the AI reply was malformed. Try asking again.",
};

/* An error whose message is written for the user and safe to show */
class UserError extends Error {}

const state = { docs: [], selected: new Set(), history: [], busy: false, controller: null };
const $ = (id) => document.getElementById(id);
const chat = $("chat");
const chatInner = $("chat-inner");
const input = $("input");
const sendButton = $("send");

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const scrollDown = () => { chat.scrollTop = chat.scrollHeight; };

let toastTimer = null;
function toast(message, ms = 4500) {
  const node = $("toast");
  node.textContent = message;
  node.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { node.hidden = true; }, ms);
}

/* ---------- talking to the API ---------- */

async function friendly(response) {
  if (response.status === 503) return "The AI service is busy. Please try again in a moment.";
  try {
    const body = await response.json();
    if (typeof body.detail === "string") return body.detail;
  } catch (error) { /* not JSON, fall through */ }
  if (response.status === 422) return "That input could not be processed.";
  return "Something went wrong (error " + response.status + ").";
}

async function apiJson(path, options) {
  let response;
  try {
    response = await fetch(path, options);
  } catch (error) {
    throw new UserError("Cannot reach the Verity server. Check that it is running.");
  }
  if (!response.ok) throw new UserError(await friendly(response));
  return response.json();
}

/* ---------- documents ---------- */

async function loadDocs() {
  try {
    state.docs = (await apiJson("/documents")).documents;
  } catch (error) {
    toast(error.message);
    state.docs = [];
  }
  for (const name of [...state.selected]) {
    if (!state.docs.some((d) => d.source === name)) state.selected.delete(name);
  }
  renderDocs();
}

function renderDocs() {
  const list = $("doc-list");
  list.replaceChildren();
  if (!state.docs.length) {
    list.append(el("p", "empty-docs", "No documents yet. Add a PDF to get started."));
  }
  for (const doc of state.docs) {
    const row = el("div", "doc");
    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = state.selected.has(doc.source);
    box.setAttribute("aria-label", "Search only in " + doc.source);
    box.addEventListener("change", () => {
      if (box.checked) state.selected.add(doc.source);
      else state.selected.delete(doc.source);
      renderScope();
    });
    const label = el("div");
    const name = el("span", "doc-name", doc.source);
    name.title = doc.source;
    label.append(name, el("span", "doc-meta", doc.chunks + " passages"));
    const remove = el("button", "icon-btn", "\u2715");
    remove.type = "button";
    remove.title = "Remove this document";
    remove.setAttribute("aria-label", "Remove " + doc.source);
    remove.addEventListener("click", () => removeDoc(doc.source));
    row.append(box, label, remove);
    list.append(row);
  }
  renderScope();
}

function renderScope() {
  const scope = $("scope");
  if (!state.docs.length) { scope.textContent = ""; return; }
  scope.textContent = state.selected.size && state.selected.size < state.docs.length
    ? "Searching only the ticked documents."
    : "Searching all documents. Tick one or more to limit the search.";
}

async function uploadFiles(files) {
  for (const file of files) {
    if (!file.name.toLowerCase().endsWith(".pdf")) {
      toast(file.name + " is not a PDF.");
      continue;
    }
    $("upload-status").textContent = "Indexing " + file.name + "...";
    const form = new FormData();
    form.append("file", file);
    try {
      const result = await apiJson("/upload", { method: "POST", body: form });
      toast(result.filename + " added (" + result.chunks + " passages).");
    } catch (error) {
      toast(file.name + ": " + error.message);
    }
  }
  $("upload-status").textContent = "";
  await loadDocs();
}

async function removeDoc(name) {
  if (!confirm("Remove " + name + " from Verity?")) return;
  try {
    await apiJson("/documents/" + encodeURIComponent(name), { method: "DELETE" });
    toast(name + " removed.");
  } catch (error) {
    toast(error.message);
  }
  await loadDocs();
}

/* ---------- chat ---------- */

function addUserMessage(text) {
  const row = el("div", "msg user");
  row.append(el("div", "bubble", text));
  chatInner.append(row);
  scrollDown();
}

function addAssistantMessage() {
  const row = el("div", "msg assistant");
  const body = el("div", "body");
  const stage = el("div", "stage");
  const text = el("div", "text");
  const extras = el("div", "extras");
  body.append(stage, text, extras);
  row.append(el("div", "avatar", "V"), body);
  chatInner.append(row);
  scrollDown();
  return { row, stage, text, extras };
}

async function typeOut(node, text, signal) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    node.textContent = text;
    return;
  }
  const words = text.split(" ");
  node.textContent = "";
  for (let i = 0; i < words.length; i++) {
    if (signal.aborted) { node.textContent = text; return; }
    node.textContent += (i ? " " : "") + words[i];
    if (i % 4 === 0) scrollDown();
    await sleep(18);
  }
}

function finishAnswer(view, result, question, scope) {
  const extras = view.extras;
  if (result.sources.length) {
    const cites = el("div", "cites");
    for (const source of result.sources) {
      const chip = el("span", "cite");
      chip.append(el("span", "file", source.source), el("span", "page", "p." + source.page));
      cites.append(chip);
    }
    extras.append(cites);
  }
  const used = result.question_used;
  if (used && used !== question) extras.append(el("p", "note", "Searched for: " + used));
  if (scope) extras.append(el("p", "note", "Searched in: " + scope.join(", ")));
  if (STATUS_NOTES[result.status]) extras.append(el("p", "note", STATUS_NOTES[result.status]));
  if (result.status === "answered") {
    const actions = el("div", "actions");
    const copy = el("button", "link-btn", "Copy");
    copy.type = "button";
    copy.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(result.answer);
        copy.textContent = "Copied";
        setTimeout(() => { copy.textContent = "Copy"; }, 1500);
      } catch (error) {
        toast("Your browser blocked copying.");
      }
    });
    actions.append(copy);
    extras.append(actions);
  }
}

function setBusy(busy) {
  state.busy = busy;
  sendButton.classList.toggle("busy", busy);
  sendButton.setAttribute("aria-label", busy ? "Stop" : "Send");
  updateSendState();
}

function updateSendState() {
  sendButton.disabled = !state.busy && input.value.trim() === "";
}

async function readEvents(response, onEvent) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let newline;
    while ((newline = buffer.indexOf("\n")) >= 0) {
      const line = buffer.slice(0, newline).trim();
      buffer = buffer.slice(newline + 1);
      if (line) onEvent(JSON.parse(line));
    }
  }
}

async function ask(question) {
  if (state.busy || !question.trim()) return;
  $("empty").hidden = true;
  addUserMessage(question);
  const view = addAssistantMessage();
  const controller = new AbortController();
  state.controller = controller;
  setBusy(true);

  const body = { question, history: state.history.slice(-20) };
  const scope = state.selected.size && state.selected.size < state.docs.length ? [...state.selected] : null;
  if (scope) body.sources = scope;

  try {
    let response;
    try {
      response = await fetch("/ask/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
        signal: controller.signal,
      });
    } catch (error) {
      if (error.name === "AbortError") throw error;
      throw new UserError("Cannot reach the Verity server. Check that it is running.");
    }
    if (!response.ok) throw new UserError(await friendly(response));

    let result = null;
    await readEvents(response, (event) => {
      if (event.event === "stage") view.stage.textContent = event.message;
      else if (event.event === "result") result = event.result;
      else if (event.event === "error") throw new UserError(event.message);
    });
    if (!result) throw new UserError("No answer was returned. Please try again.");

    view.stage.textContent = "";
    await typeOut(view.text, result.answer, controller.signal);
    finishAnswer(view, result, question, scope);
    state.history.push(
      { role: "user", content: question.slice(0, 2000) },
      { role: "assistant", content: result.answer.slice(0, 2000) },
    );
  } catch (error) {
    view.stage.textContent = "";
    if (error.name === "AbortError") {
      view.text.textContent = "Stopped.";
      view.text.classList.add("muted");
    } else {
      if (!(error instanceof UserError)) console.error(error);
      view.text.textContent = error instanceof UserError
        ? error.message
        : "The connection was interrupted. Please try again.";
      view.text.classList.add("error");
    }
  } finally {
    state.controller = null;
    setBusy(false);
    scrollDown();
    input.focus();
  }
}

function newChat() {
  if (state.controller) state.controller.abort();
  state.history = [];
  chatInner.querySelectorAll(".msg").forEach((node) => node.remove());
  $("empty").hidden = false;
  input.focus();
}

/* ---------- wiring ---------- */

$("composer").addEventListener("submit", (event) => {
  event.preventDefault();
  if (state.busy) {
    if (state.controller) state.controller.abort();
    return;
  }
  const question = input.value.trim();
  if (!question) return;
  input.value = "";
  autoGrow();
  updateSendState();
  ask(question);
});

input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    if (!state.busy) $("composer").requestSubmit();
  }
});
input.addEventListener("input", () => { autoGrow(); updateSendState(); });

function autoGrow() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 200) + "px";
}

$("new-chat").addEventListener("click", newChat);
$("add-pdf").addEventListener("click", () => $("file-input").click());
$("file-input").addEventListener("change", (event) => {
  uploadFiles([...event.target.files]);
  event.target.value = "";
});
$("menu").addEventListener("click", () => document.body.classList.toggle("menu-open"));
$("scrim").addEventListener("click", () => document.body.classList.remove("menu-open"));

for (const text of SUGGESTIONS) {
  const button = el("button", "btn", text);
  button.type = "button";
  button.addEventListener("click", () => ask(text));
  $("suggestions").append(button);
}

let dragDepth = 0;
const hasFiles = (event) => event.dataTransfer && [...event.dataTransfer.types].includes("Files");
addEventListener("dragenter", (event) => {
  if (!hasFiles(event)) return;
  dragDepth++;
  document.body.classList.add("dragging");
});
addEventListener("dragleave", (event) => {
  if (!hasFiles(event)) return;
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) document.body.classList.remove("dragging");
});
addEventListener("dragover", (event) => { if (hasFiles(event)) event.preventDefault(); });
addEventListener("drop", (event) => {
  if (!hasFiles(event)) return;
  event.preventDefault();
  dragDepth = 0;
  document.body.classList.remove("dragging");
  uploadFiles([...event.dataTransfer.files]);
});

updateSendState();
loadDocs();
input.focus();
</script>
</body>
</html>
